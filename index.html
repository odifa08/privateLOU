<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P of LOU</title>

    <!-- 1. 브라우저 파비콘 / 애플 터치 아이콘 (icon.png 사용) -->
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="manifest" href='data:application/manifest+json,{"name":"P of LOU","short_name":"P of LOU","start_url":".","display":"standalone","background_color":"#0b0f19","theme_color":"#0b0f19","icons":[{"src":"icon.png","sizes":"512x512","type":"image/png"}]}'>

    <style>
        /* 기본 테마 및 레이아웃 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
        }

        /* 2. 상단 헤더 스타일 (아이콘 크기 및 시즌 선택창 높이 고정) */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #151c2c;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 아이콘 이미지 크기를 28x28px로 고정하여 헤더가 커지지 않도록 방지 */
        .header-icon {
            width: 28px;
            height: 28px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .season-select-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .season-select-wrapper label {
            white-space: nowrap;
            font-size: 0.95rem;
            color: #a0aec0;
        }

        /* 시즌 선택 박스 높이 고정 (거대해짐 방지) */
        #season-selector {
            height: 38px;
            padding: 0 12px;
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 6px;
            font-weight: bold;
            outline: none;
        }

        /* 모달 및 폼 스타일 */
        .modal-content {
            background-color: #151c2c;
            padding: 20px;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .form-section-title {
            color: #38bdf8;
            font-weight: bold;
            margin: 16px 0 8px 0;
            font-size: 0.95rem;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 0.95rem;
        }

        .input-with-btn {
            display: flex;
            gap: 6px;
        }

        .btn-minus {
            background-color: #334155;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: #475569;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 영역 -->
    <div class="header-container">
        <div class="header-title" id="dashboard-title">
            <img src="./icon.png" alt="icon" class="header-icon">
            <span>P of LOU</span>
        </div>
        
        <div class="season-select-wrapper">
            <label for="season-selector">시즌:</label>
            <select id="season-selector">
                <option value="S1">S1</option>
                <option value="S2" selected>S2</option>
                <option value="S3">S3</option>
            </select>
        </div>
    </div>

    <!-- 매매 시트 저장 모달/폼 -->
    <div class="modal-content">
        <h2 style="margin-bottom: 16px; font-size: 1.2rem;">🚀 매매 시트 저장 (A~Q열)</h2>
        
        <form id="tradeForm">
            <div class="col" style="margin-bottom: 12px;">
                <label>시즌 지정 (Q열 저장 항목)</label>
                <input type="text" id="sheetName" value="S2" readonly style="color: #38bdf8; font-weight: bold;">
            </div>

            <div class="col" style="margin-bottom: 12px;">
                <label for="date">거래 날짜 (A열)</label>
                <input type="date" id="date" required>
            </div>

            <!-- 매수 내역 -->
            <div class="form-section-title">매수 내역 (B~G열)</div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="buyPrice1" placeholder="1차 매수가 (B)"></div>
                <div class="col"><input type="number" step="any" id="buyQty1" placeholder="1차 수량 (C)"></div>
            </div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="buyPrice2" placeholder="2차 매수가 (D)"></div>
                <div class="col"><input type="number" step="any" id="buyQty2" placeholder="2차 수량 (E)"></div>
            </div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="buyPrice3" placeholder="3차 매수가 (F)"></div>
                <div class="col"><input type="number" step="any" id="buyQty3" placeholder="3차 수량 (G)"></div>
            </div>

            <!-- 매도 내역 -->
            <div class="form-section-title">매도 내역 (H~M열)</div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="sellPrice1" placeholder="1차 매도가 (H)"></div>
                <div class="col"><input type="number" step="any" id="sellQty1" placeholder="1차 수량 (I)"></div>
            </div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="sellPrice2" placeholder="2차 매도가 (J)"></div>
                <div class="col"><input type="number" step="any" id="sellQty2" placeholder="2차 수량 (K)"></div>
            </div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="sellPrice3" placeholder="3차 매도가 (L)"></div>
                <div class="col"><input type="number" step="any" id="sellQty3" placeholder="3차 수량 (M)"></div>
            </div>

            <!-- 결과 요약 -->
            <div class="form-section-title">결과 요약 (N, O, P열)</div>
            <div class="row">
                <div class="col">
                    <label for="avgPrice">평단 (N열)</label>
                    <input type="number" step="any" id="avgPrice" placeholder="0">
                </div>
                <div class="col">
                    <label for="totalQty">수량 (O열)</label>
                    <input type="number" step="any" id="totalQty" placeholder="0">
                </div>
                <!-- 중복 표기되었던 수익실현(P열) 부분 수정 완료 -->
                <div class="col">
                    <label for="profit">수익실현 (P열)</label>
                    <div class="input-with-btn">
                        <input type="number" step="any" id="profit" placeholder="0">
                        <button type="button" class="btn-minus" onclick="toggleMinus('profit')">+/-</button>
                    </div>
                </div>
            </div>

            <div id="loading">저장 중입니다... 잠시만 기다려주세요.</div>

            <div class="btn-group">
                <button type="button" class="btn-cancel">취소</button>
                <button type="submit" class="btn-submit">매매 시트에 저장</button>
            </div>
        </form>
    </div>

    <script>
        // Apps Script 웹앱 URL (본인의 URL로 확인해 주세요)
        const gasAppUrl = 'https://script.google.com/macros/s/AKfycbx.../exec';

        // 오늘 날짜 기본 세팅
        document.getElementById('date').value = new Date().toISOString().substring(0, 10);

        // 시즌 선택 변경 시 매매 폼 Q열 값 동기화
        document.getElementById('season-selector').addEventListener('change', (e) => {
            document.getElementById('sheetName').value = e.target.value;
        });

        // +/- 버튼 (음수/양수 전환)
        function toggleMinus(id) {
            const input = document.getElementById(id);
            if (input.value) {
                input.value = (parseFloat(input.value) * -1);
            }
        }

        // 폼 제출 이벤트
        document.getElementById('tradeForm').onsubmit = function(e) {
            e.preventDefault();
            
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'block';

            const payload = {
                date: document.getElementById('date').value,
                buyPrice1: document.getElementById('buyPrice1').value,
                buyQty1: document.getElementById('buyQty1').value,
                buyPrice2: document.getElementById('buyPrice2').value,
                buyQty2: document.getElementById('buyQty2').value,
                buyPrice3: document.getElementById('buyPrice3').value,
                buyQty3: document.getElementById('buyQty3').value,
                sellPrice1: document.getElementById('sellPrice1').value,
                sellQty1: document.getElementById('sellQty1').value,
                sellPrice2: document.getElementById('sellPrice2').value,
                sellQty2: document.getElementById('sellQty2').value,
                sellPrice3: document.getElementById('sellPrice3').value,
                sellQty3: document.getElementById('sellQty3').value,
                avgPrice: document.getElementById('avgPrice').value,
                totalQty: document.getElementById('totalQty').value,
                profit: document.getElementById('profit').value,
                sheetName: document.getElementById('sheetName').value
            };

            // CORS 문제 해결된 fetch 요청 (mode: 'no-cors' 제거)
            fetch(gasAppUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                loadingEl.style.display = 'none';
                if (data.status === 'success') {
                    alert(`[매매] 시트에 ${payload.sheetName} 데이터가 정상적으로 저장되었습니다!`);
                    document.getElementById('tradeForm').reset();
                    document.getElementById('date').value = new Date().toISOString().substring(0, 10);
                } else {
                    alert('저장 실패: ' + data.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert('저장 중 통신 오류가 발생했습니다.');
                loadingEl.style.display = 'none';
            });
        };
    </script>
</body>
</html>
