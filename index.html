<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P of LOU</title>

    <!-- Chart.js 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 파비콘 및 웹앱 설정 -->
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="manifest" href='data:application/manifest+json,{"name":"P of LOU","short_name":"P of LOU","start_url":".","display":"standalone","background_color":"#0b0f19","theme_color":"#0b0f19","icons":[{"src":"icon.png","sizes":"512x512","type":"image/png"}]}'>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
        }

        /* 1. 상단 헤더 */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #151c2c;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .header-icon {
            width: 28px;
            height: 28px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .season-select-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .season-select-wrapper label {
            white-space: nowrap;
            font-size: 0.95rem;
            color: #a0aec0;
        }

        #season-selector {
            height: 38px;
            padding: 0 12px;
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 6px;
            font-weight: bold;
            outline: none;
        }

        .btn-open-modal {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            height: 38px;
        }

        /* 2. 대시보드 & 차트 컨테이너 */
        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: #151c2c;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #1e293b;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 350px;
        }

        /* 3. 모달 (팝업창) 스타일 */
        .modal-overlay {
            display: none; /* 기본 숨김 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background-color: #151c2c;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
        }

        .form-section-title {
            color: #38bdf8;
            font-weight: bold;
            margin: 16px 0 8px 0;
            font-size: 0.95rem;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 0.95rem;
        }

        .input-with-btn {
            display: flex;
            gap: 6px;
        }

        .btn-minus {
            background-color: #334155;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: #475569;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 영역 -->
    <div class="header-container">
        <div class="header-title" id="dashboard-title">
            <img src="./icon.png" alt="icon" class="header-icon">
            <span>P of LOU</span>
        </div>
        
        <div class="header-right">
            <div class="season-select-wrapper">
                <label for="season-selector">시즌:</label>
                <select id="season-selector">
                    <option value="S1">S1</option>
                    <option value="S2" selected>S2</option>
                    <option value="S3">S3</option>
                </select>
            </div>
            <!-- 입력 모달 열기 버튼 -->
            <button class="btn-open-modal" onclick="openModal()">+ 매매 기록 입력</button>
        </div>
    </div>

    <!-- 대시보드 및 차트 영역 -->
    <div class="dashboard-container">
        <div class="card">
            <h3 style="margin-bottom: 15px; color: #38bdf8;">📊 시즌 매매 추이</h3>
            <div class="chart-container">
                <canvas id="tradeChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 매매 시트 저장 모달 (팝업창) -->
    <div class="modal-overlay" id="tradeModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 16px; font-size: 1.2rem;">🚀 매매 시트 저장</h2>
            
            <form id="tradeForm">
                <div class="col" style="margin-bottom: 12px;">
                    <label>시즌</label>
                    <input type="text" id="sheetName" value="S2" readonly style="color: #38bdf8; font-weight: bold;">
                </div>

                <div class="col" style="margin-bottom: 12px;">
                    <label for="date">거래 날짜</label>
                    <input type="date" id="date" required>
                </div>

                <!-- 매수 내역 -->
                <div class="form-section-title">매수 내역</div>
                <div class="row">
                    <div class="col"><input type="number" step="any" id="buyPrice1" placeholder="1차 매수가 (B)"></div>
                    <div class="col"><input type="number" step="any" id="buyQty1" placeholder="1차 수량 (C)"></div>
                </div>
                <div class="row">
                    <div class="col"><input type="number" step="any" id="buyPrice2" placeholder="2차 매수가 (D)"></div>
                    <div class="col"><input type="number" step="any" id="buyQty2" placeholder="2차 수량 (E)"></div>
                </div>
                <div class="row">
                    <div class="col"><input type="number" step="any" id="buyPrice3" placeholder="3차 매수가 (F)"></div>
                    <div class="col"><input type="number" step="any" id="buyQty3" placeholder="3차 수량 (G)"></div>
                </div>

                <!-- 매도 내역 -->
                <div class="form-section-title">매도 내역</div>
                <div class="row">
                    <div class="col"><input type="number" step="any" id="sellPrice1" placeholder="1차 매도가 (H)"></div>
                    <div class="col"><input type="number" step="any" id="sellQty1" placeholder="1차 수량 (I)"></div>
                </div>
                <div class="row">
                    <div class="col"><input type="number" step="any" id="sellPrice2" placeholder="2차 매도가 (J)"></div>
                    <div class="col"><input type="number" step="any" id="sellQty2" placeholder="2차 수량 (K)"></div>
                </div>
                <div class="row">
                    <div class="col"><input type="number" step="any" id="sellPrice3" placeholder="3차 매도가 (L)"></div>
                    <div class="col"><input type="number" step="any" id="sellQty3" placeholder="3차 수량 (M)"></div>
                </div>

                <!-- 결과 요약 -->
                <div class="form-section-title">결과 요약</div>
                <div class="row">
                    <div class="col">
                        <label for="avgPrice">평단</label>
                        <input type="number" step="any" id="avgPrice" placeholder="0">
                    </div>
                    <div class="col">
                        <label for="totalQty">수량</label>
                        <input type="number" step="any" id="totalQty" placeholder="0">
                    </div>
                    <div class="col">
                        <label for="profit">수익실현</label>
                        <div class="input-with-btn">
                            <input type="number" step="any" id="profit" placeholder="0">
                            <button type="button" class="btn-minus" onclick="toggleMinus('profit')">+/-</button>
                        </div>
                    </div>
                </div>

                <div id="loading">저장 중입니다... 잠시만 기다려주세요.</div>

                <div class="btn-group">
                    <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
                    <button type="submit" class="btn-submit">매매 시트에 저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const gasAppUrl = 'https://script.google.com/macros/s/AKfycbw0YAWywc-4ioF0gnu71AbhJlNJLhahAG6ey0JR6Pn-r4qx7uY4L7p4V1_AC9lm-xdygg/exec';

        // 오늘 날짜 기본 세팅
        document.getElementById('date').value = new Date().toISOString().substring(0, 10);

        // 모달 열기/닫기 제어
        function openModal() {
            document.getElementById('tradeModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('tradeModal').style.display = 'none';
        }

        // 시즌 선택 변경 시 매매 폼 Q열 값 동기화
        document.getElementById('season-selector').addEventListener('change', (e) => {
            document.getElementById('sheetName').value = e.target.value;
            // 시즌 변경 시 차트 재로드 로직을 여기에 연결할 수 있습니다.
        });

        // +/- 버튼 (음수/양수 전환)
        function toggleMinus(id) {
            const input = document.getElementById(id);
            if (input.value) {
                input.value = (parseFloat(input.value) * -1);
            }
        }

        // --- 샘플 차트 초기화 (시트 데이터를 받아와 그려주는 부분) ---
        let tradeChart;
        function initChart() {
            const ctx = document.getElementById('tradeChart').getContext('2d');
            tradeChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5'],
                    datasets: [{
                        label: '평단가',
                        data: [0, 0, 0, 0, 0],
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#ffffff' } }
                    },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
                    }
                }
            });
        }
        initChart();

        // 폼 제출 이벤트
        document.getElementById('tradeForm').onsubmit = function(e) {
            e.preventDefault();
            
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'block';

            const payload = {
                date: document.getElementById('date').value,
                buyPrice1: document.getElementById('buyPrice1').value,
                buyQty1: document.getElementById('buyQty1').value,
                buyPrice2: document.getElementById('buyPrice2').value,
                buyQty2: document.getElementById('buyQty2').value,
                buyPrice3: document.getElementById('buyPrice3').value,
                buyQty3: document.getElementById('buyQty3').value,
                sellPrice1: document.getElementById('sellPrice1').value,
                sellQty1: document.getElementById('sellQty1').value,
                sellPrice2: document.getElementById('sellPrice2').value,
                sellQty2: document.getElementById('sellQty2').value,
                sellPrice3: document.getElementById('sellPrice3').value,
                sellQty3: document.getElementById('sellQty3').value,
                avgPrice: document.getElementById('avgPrice').value,
                totalQty: document.getElementById('totalQty').value,
                profit: document.getElementById('profit').value,
                sheetName: document.getElementById('sheetName').value
            };

            fetch(gasAppUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                loadingEl.style.display = 'none';
                if (data.status === 'success') {
                    alert(`[매매] 시트에 ${payload.sheetName} 데이터가 정상적으로 저장되었습니다!`);
                    closeModal();
                    document.getElementById('tradeForm').reset();
                    document.getElementById('date').value = new Date().toISOString().substring(0, 10);
                } else {
                    alert('저장 실패: ' + data.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert('저장 중 통신 오류가 발생했습니다.');
                loadingEl.style.display = 'none';
            });
        };
    </script>
</body>
</html>
