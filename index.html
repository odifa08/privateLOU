<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P of LOU</title>
    
    <!-- Web App 바로가기 아이콘 및 Manifest (Data URI 기반) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="manifest" href='data:application/manifest+json,{"name":"P of LOU","short_name":"P of LOU","start_url":".","display":"standalone","background_color":"#0b0f19","theme_color":"#0b0f19","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>
    <meta name="theme-color" content="#0b0f19">

    <!-- 프리텐다드 웹 폰트 CDN -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://unpkg.com/highcharts@11.4.0/highcharts.js"></script>
    <style>
        body { 
            background: #0b0f19; 
            color: #f8fafc; 
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            margin: 0; 
            padding: 12px; 
        }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .header-title { font-size: 18px; font-weight: bold; }
        .season-select { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 13px; }
        
        .chart-box { width: 100%; height: 320px; margin-bottom: 20px; }
        @media (min-width: 768px) {
            .chart-box { height: 500px; }
            body { padding: 20px; }
            .header-title { font-size: 22px; }
        }

        .dashboard-section { margin-top: 25px; padding-top: 20px; border-top: 1px solid #1e293b; }
        
        .summary-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        @media (min-width: 768px) {
            .summary-cards { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        }

        .card { background: #131b2e; padding: 14px; border-radius: 10px; border: 1px solid #1e293b; }
        .card-title { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
        .card-value { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
        @media (min-width: 768px) {
            .card { padding: 20px; }
            .card-title { font-size: 13px; }
            .card-value { font-size: 26px; }
        }
        .card-sub { font-size: 11px; color: #64748b; }
        #loading { position: fixed; inset: 0; background: rgba(11, 15, 25, 0.9); display: flex; justify-content: center; align-items: center; color: #38bdf8; font-size: 18px; font-weight: bold; z-index: 9999; }

        /* Floating Action Button (+) */
        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 56px;
            height: 56px;
            background-color: #38bdf8;
            color: #0b0f19;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.2s, background-color 0.2s;
        }
        .fab:hover { transform: scale(1.08); background-color: #7dd3fc; }

        /* 모달 스타일 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 15px;
        }
        .modal-content {
            background: #131b2e;
            border: 1px solid #1e293b;
            border-radius: 12px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #f8fafc; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #94a3b8; margin-bottom: 4px; }
        
        .section-title { 
            font-size: 13px; 
            font-weight: bold; 
            color: #38bdf8; 
            margin-top: 15px; 
            margin-bottom: 8px; 
            border-bottom: 1px solid #334155; 
            padding-bottom: 4px; 
        }
        .row { display: flex; gap: 8px; margin-bottom: 8px; }
        .col { flex: 1; }
        
        /* 마이너스 토글 버튼 전용 입력 그룹 */
        .input-with-btn {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-minus {
            background: #334155;
            color: #f87171;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }
        .btn-minus:active {
            background: #f87171;
            color: #0b0f19;
        }

        input, select {
            width: 100%;
            padding: 8px 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 13px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn { padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; }
        .btn-cancel { background: #334155; color: #cbd5e1; }
        .btn-submit { background: #4ade80; color: #0b0f19; }
        .btn-submit:hover { background: #22c55e; }
    </style>
    
    <!-- 🔒 비밀번호 잠금 자바스크립트 -->
    <script>
        (function() {
            const MY_PASSWORD = "qwer"; 

            if (sessionStorage.getItem("authenticated") !== "true") {
                const userInput = prompt("🔒 비밀번호를 입력하세요:");
                if (userInput === MY_PASSWORD) {
                    sessionStorage.setItem("authenticated", "true");
                } else {
                    alert("비밀번호가 올바르지 않습니다.");
                    document.write("<div style='background:#0b0f19; color:#f87171; height:100vh; display:flex; justify-content:center; align-items:center; font-family:sans-serif; font-size:20px; font-weight:bold;'>⛔ 접근 권한이 없습니다.</div>");
                    window.stop();
                }
            }
        })();
    </script>
</head>
<body>

<div id="loading">빠르게 데이터를 불러오는 중...</div>

<div class="header-bar">
    <div class="header-title" id="dashboard-title">📊 P of LOU</div>
    <div>
        <span style="color:#94a3b8; font-size:13px; margin-right:6px;">시즌:</span>
        <select id="season-selector" class="season-select"></select>
    </div>
</div>

<div id="chart-container" class="chart-box"></div>
<div class="summary-cards">
    <div class="card"><div class="card-title">총자산 (MTM)</div><div class="card-value" style="color: #c084fc;" id="card-total-val">$0</div><div class="card-sub">잔금 + 평가금</div></div>
    <div class="card"><div class="card-title">잔금 (현금)</div><div class="card-value" style="color: #38bdf8;" id="card-cash-val">$0</div><div class="card-sub">가용 현금 자산</div></div>
    <div class="card"><div class="card-title">누적 실현 손익</div><div class="card-value" style="color: #4ade80;" id="card-realized-val">$0</div><div class="card-sub">확정 누적 실현</div></div>
    <div class="card"><div class="card-title">평가금 (보유)</div><div class="card-value" style="color: #f59e0b;" id="card-eval-val">$0</div><div class="card-sub">현재 보유 포지션 평가</div></div>
</div>

<div class="dashboard-section">
    <div class="summary-cards">
        <div class="card"><div class="card-title">진행 상황 (시즌-회차-일)</div><div class="card-value" style="color: #38bdf8;" id="card-total-cycles">-</div><div class="card-sub" id="card-closed-cycles-sub">총 0회 마감</div></div>
        <div class="card"><div class="card-title">수익 사이클 비율</div><div class="card-value" style="color: #62d3a4;" id="card-win-rate">0%</div><div class="card-sub" id="card-win-loss-count">0승 0패</div></div>
        <div class="card"><div class="card-title">중앙값 사이클 길이</div><div class="card-value" id="card-median-days">0일</div><div class="card-sub">마감 사이클 기준</div></div>
        <div class="card"><div class="card-title">최장 사이클</div><div class="card-value" style="color: #fbbf24;" id="card-max-days">0일</div><div class="card-sub">가장 오래 끈 회전</div></div>
    </div>
    <div id="cycle-chart-container" class="chart-box"></div>
</div>

<div class="dashboard-section">
    <div id="cum-return-chart-container" class="chart-box"></div>
</div>

<!-- Floating Action Button (+) -->
<div class="fab" id="openModalBtn">+</div>

<!-- 입력 모달 -->
<div class="modal-overlay" id="inputModal">
    <div class="modal-content">
        <div class="modal-header">🚀 매매 시트 저장 (A~Q열)</div>
        <form id="tradeForm">
            <div class="form-group">
                <label for="modalSeasonSelect">시즌 지정 (Q열 저장 항목)</label>
                <select id="modalSeasonSelect" style="color:#38bdf8; font-weight:bold;"></select>
            </div>

            <div class="form-group">
                <label for="date">거래 날짜 (A열)</label>
                <input type="date" id="date" required>
            </div>

            <div class="section-title">매수 내역 (B~G열)</div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="buyPrice1" placeholder="1차 매수가 (B)"></div>
                <div class="col"><input type="number" step="any" id="buyQty1" placeholder="1차 수량 (C)"></div>
            </div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="buyPrice2" placeholder="2차 매수가 (D)"></div>
                <div class="col"><input type="number" step="any" id="buyQty2" placeholder="2차 수량 (E)"></div>
            </div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="buyPrice3" placeholder="3차 매수가 (F)"></div>
                <div class="col"><input type="number" step="any" id="buyQty3" placeholder="3차 수량 (G)"></div>
            </div>

            <div class="section-title">매도 내역 (H~M열)</div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="sellPrice1" placeholder="1차 매도가 (H)"></div>
                <div class="col"><input type="number" step="any" id="sellQty1" placeholder="1차 수량 (I)"></div>
            </div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="sellPrice2" placeholder="2차 매도가 (J)"></div>
                <div class="col"><input type="number" step="any" id="sellQty2" placeholder="2차 수량 (K)"></div>
            </div>
            <div class="row">
                <div class="col"><input type="number" step="any" id="sellPrice3" placeholder="3차 매도가 (L)"></div>
                <div class="col"><input type="number" step="any" id="sellQty3" placeholder="3차 수량 (M)"></div>
            </div>

            <div class="section-title">결과 요약 (N, O, P열)</div>
            <div class="row">
                <div class="col">
                    <label for="avgPrice">평단 (N열)</label>
                    <input type="number" step="any" id="avgPrice" placeholder="평단">
                </div>
                <div class="col">
                    <label for="totalQty">수량 (O열)</label>
                    <input type="number" step="any" id="totalQty" placeholder="수량">
                </div>
                <div class="col">
                    <label for="profit">수익실현 (P열)</label>
                    <!-- 수익실현 칸에만 [-] 마이너스 토글 버튼 유지 -->
                    <div class="input-with-btn">
                        <input type="number" step="any" id="profit" placeholder="수익실현">
                        <button type="button" class="btn-minus" onclick="toggleMinus('profit')">-</button>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" id="closeModalBtn">취소</button>
                <button type="submit" class="btn btn-submit">매매 시트에 저장</button>
            </div>
        </form>
    </div>
</div>

<script>
// 모바일 입력 키패드 부호 전환용 마이너스 토글 함수
function toggleMinus(inputId) {
    const input = document.getElementById(inputId);
    if (!input) return;
    let val = input.value.trim();
    if (val.startsWith('-')) {
        input.value = val.substring(1);
    } else {
        input.value = '-' + val;
    }
}

const gasAppUrl = "https://script.google.com/macros/s/AKfycbz-IxTrZ9q_1MUB8i3u_eQtP66lqyZ8tfxcE90LNspU1X_JllbJI21gfDpGtoVcIzXvaA/exec";

document.addEventListener("DOMContentLoaded", function () {
    const selector = document.getElementById('season-selector');
    const loadingEl = document.getElementById('loading');
    const modal = document.getElementById('inputModal');
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const tradeForm = document.getElementById('tradeForm');

    document.getElementById('date').value = new Date().toISOString().substring(0, 10);

    openBtn.onclick = () => {
        const mainSelector = document.getElementById('season-selector');
        const modalSelector = document.getElementById('modalSeasonSelect');
        
        modalSelector.innerHTML = '';
        Array.from(mainSelector.options).forEach(opt => {
            if (opt.value !== 'ALL') {
                const newOpt = document.createElement('option');
                newOpt.value = opt.value;
                newOpt.text = opt.text;
                if (opt.value === mainSelector.value) newOpt.selected = true;
                modalSelector.appendChild(newOpt);
            }
        });

        if (!modalSelector.value && modalSelector.options.length > 0) {
            modalSelector.options[0].selected = true;
        }

        modal.style.display = 'flex';
    };

    closeBtn.onclick = () => modal.style.display = 'none';

    tradeForm.onsubmit = function(e) {
        e.preventDefault();
        
        const selectedSeason = document.getElementById('modalSeasonSelect').value;
        
        const payload = {
            sheetName: selectedSeason,
            date: document.getElementById('date').value,
            buyPrice1: document.getElementById('buyPrice1').value,
            buyQty1: document.getElementById('buyQty1').value,
            buyPrice2: document.getElementById('buyPrice2').value,
            buyQty2: document.getElementById('buyQty2').value,
            buyPrice3: document.getElementById('buyPrice3').value,
            buyQty3: document.getElementById('buyQty3').value,
            sellPrice1: document.getElementById('sellPrice1').value,
            sellQty1: document.getElementById('sellQty1').value,
            sellPrice2: document.getElementById('sellPrice2').value,
            sellQty2: document.getElementById('sellQty2').value,
            sellPrice3: document.getElementById('sellPrice3').value,
            sellQty3: document.getElementById('sellQty3').value,
            avgPrice: document.getElementById('avgPrice').value,
            totalQty: document.getElementById('totalQty').value,
            profit: document.getElementById('profit').value
        };

        loadingEl.style.display = 'flex';
        loadingEl.innerText = `[매매] 시트에 (${selectedSeason}) 저장 중...`;

        fetch(gasAppUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert(`[매매] 시트에 ${selectedSeason} 데이터가 정상적으로 저장되었습니다!`);
            modal.style.display = 'none';
            tradeForm.reset();
            document.getElementById('date').value = new Date().toISOString().substring(0, 10);
            
            fetchSeasonData(document.getElementById('season-selector').value);
        })
        .catch(err => {
            console.error(err);
            alert('저장 중 오류가 발생했습니다.');
            loadingEl.style.display = 'none';
        });
    };

    Highcharts.setOptions({ 
        time: { useUTC: false },
        chart: { style: { fontFamily: "'Pretendard Variable', Pretendard, sans-serif" } }
    });

    fetchSeasonData();

    selector.onchange = function() { fetchSeasonData(this.value); };

    function fetchSeasonData(sheetName = '') {
        loadingEl.style.display = 'flex';
        loadingEl.innerText = "빠르게 데이터를 불러오는 중...";
        
        const url = sheetName ? `${gasAppUrl}?sheet=${encodeURIComponent(sheetName)}` : gasAppUrl;

        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error("Network response was not ok");
                return res.json();
            })
            .then(res => {
                if (res.availableSeasons) updateDropdown(res.availableSeasons, res.currentSheet);
                
                document.getElementById('dashboard-title').innerText = `📊 P of LOU`;
                
                renderDashboard(res.rows, res.currentSheet);
                loadingEl.style.display = 'none';
            })
            .catch(err => { 
                console.error(err);
                loadingEl.style.display = 'flex';
                loadingEl.innerHTML = "<div style='text-align:center;'>⚠️ 데이터 로드 실패<br><span style='font-size:13px; color:#94a3b8; font-weight:normal;'>gasAppUrl 및 Apps Script 배포 권한을 확인하세요.</span></div>"; 
            });
    }

    function updateDropdown(list, current) {
        selector.innerHTML = list.map(s => `<option value="${s}" ${s === current ? 'selected' : ''}>${s === 'ALL' ? '🌐 All' : s}</option>`).join('');
    }

    function renderDashboard(rows, seasonName) {
        const seriesTotal = [], seriesRealized = [], seriesEval = [], seriesCash = [], cumReturnData = [];
        const winMarkers = [], lossMarkers = [];
        const cycleDaysMap = {}, cycleProfitMap = {};
        
        let initialCapital = null;

        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row[1]) continue;

            const parts = String(row[1]).match(/\d+/g);
            if (!parts || parts.length < 3) continue;

            const yyyy = parts[0];
            const mm = String(parts[1]).padStart(2, '0');
            const dd = String(parts[2]).padStart(2, '0');
            const dateStr = `${yyyy}-${mm}-${dd}`;

            const timestamp = new Date(+yyyy, +parts[1] - 1, +dd, 0, 0, 0).getTime();

            const totalVal = parseFloat(String(row[2]).replace(/[^0-9.-]+/g, "")) || 0;
            const realizedVal = parseFloat(String(row[3]).replace(/[^0-9.-]+/g, "")) || 0;
            const evalVal = parseFloat(String(row[4]).replace(/[^0-9.-]+/g, "")) || 0;
            const cashVal = parseFloat(String(row[5]).replace(/[^0-9.-]+/g, "")) || 0;
            const dailyProfit = parseFloat(String(row[9]).replace(/[^0-9.-]+/g, "")) || 0;
            const cycleNo = Number(String(row[11]).replace(/[^0-9]+/g, "")) || 0;
            const totalCycleProfit = parseFloat(String(row[12]).replace(/[^0-9.-]+/g, "")) || 0;

            if (initialCapital === null && totalVal > 0) initialCapital = totalVal;

            seriesTotal.push({ x: timestamp, y: totalVal, dateStr: dateStr });
            seriesRealized.push({ x: timestamp, y: realizedVal, dateStr: dateStr });
            seriesEval.push({ x: timestamp, y: evalVal, dateStr: dateStr });
            seriesCash.push({ x: timestamp, y: cashVal, dateStr: dateStr });

            const cumReturnPct = initialCapital ? +((realizedVal / initialCapital) * 100).toFixed(2) : 0;
            cumReturnData.push({ x: timestamp, y: cumReturnPct, dateStr: dateStr });

            if (cycleNo > 0) {
                cycleDaysMap[cycleNo] = (cycleDaysMap[cycleNo] || 0) + 1;
                cycleProfitMap[cycleNo] = (row[12] !== undefined && row[12] !== "") ? totalCycleProfit : ((cycleProfitMap[cycleNo] || 0) + dailyProfit);

                if (evalVal === 0) {
                    const cProfit = cycleProfitMap[cycleNo];
                    const marker = { 
                        x: timestamp, 
                        y: cumReturnPct, 
                        dateStr: dateStr, 
                        name: cycleNo + '차 마감', 
                        color: cProfit < 0 ? '#f87171' : '#62d3a4', 
                        marker: { symbol: 'diamond', radius: 6 } 
                    };
                    
                    if (cProfit < 0) {
                        lossMarkers.push(marker);
                    } else if (cProfit > 0) {
                        winMarkers.push(marker);
                    }
                }
            }
        }

        if (seriesTotal.length > 0) {
            const latestTotal = seriesTotal[seriesTotal.length - 1].y;
            const latestCash = seriesCash[seriesCash.length - 1].y;
            const latestRealized = seriesRealized[seriesRealized.length - 1].y;
            const latestEval = seriesEval[seriesEval.length - 1].y;

            document.getElementById('card-total-val').innerText = '$' + Highcharts.numberFormat(latestTotal, 0, '.', ',');
            document.getElementById('card-cash-val').innerText = '$' + Highcharts.numberFormat(latestCash, 0, '.', ',');
            document.getElementById('card-realized-val').innerText = '$' + Highcharts.numberFormat(latestRealized, 0, '.', ',');
            document.getElementById('card-eval-val').innerText = '$' + Highcharts.numberFormat(latestEval, 0, '.', ',');
        }

        Highcharts.chart('chart-container', {
            chart: { type: 'line', backgroundColor: '#0b0f19', marginRight: 20 },
            title: { text: `Asset (${seasonName === 'ALL' ? 'All' : seasonName})`, align: 'left', style: { color: '#f8fafc', fontSize: '15px', fontWeight: 'bold' } },
            subtitle: { text: '단일 USD 축 · 총자산 = 잔금+평가금', align: 'left', style: { color: '#64748b', fontSize: '10px' } },
            xAxis: { type: 'datetime', labels: { style: { color: '#94a3b8', fontSize: '10px' }, format: '{value:%m/%d}' }, tickPixelInterval: 120, gridLineWidth: 0, lineColor: '#1e293b' },
            yAxis: { 
                title: null, gridLineColor: '#1e293b', gridLineDashStyle: 'Dash',
                labels: { style: { color: '#94a3b8', fontSize: '10px' }, formatter: function() { return '$' + Highcharts.numberFormat(this.value, 0, '.', ','); } },
                plotLines: initialCapital ? [{ value: initialCapital, color: '#64748b', dashStyle: 'ShortDot', width: 1.5, zIndex: 3, label: { text: `시드`, align: 'left', x: 0, y: -5, style: { color: '#94a3b8', fontSize: '10px' } } }] : []
            },
            tooltip: { 
                shared: true, backgroundColor: '#1e293b', style: { color: '#f8fafc', fontSize: '12px' },
                formatter: function () {
                    const targetPoint = this.points && this.points[0] ? this.points[0].point : this.point;
                    const displayDate = targetPoint && targetPoint.dateStr ? targetPoint.dateStr : '';
                    let header = `<span style="font-size: 11px; font-weight: bold; color: #cbd5e1;">${displayDate}</span><br/>`;
                    if (this.points) {
                        this.points.forEach(p => { header += `<br/><span style="color:${p.color}">●</span> ${p.series.name}: <b>$${Highcharts.numberFormat(p.y, 0, '.', ',')}</b>`; });
                    } else if (this.y !== undefined) {
                        header += `<br/><span style="color:${this.color}">●</span> ${this.series.name}: <b>${this.y}%</b>`;
                    }
                    return header;
                }
            },
            legend: { align: 'center', verticalAlign: 'bottom', layout: 'horizontal', itemStyle: { color: '#cbd5e1', fontSize: '11px' } },
            credits: { enabled: false },
            plotOptions: { line: { lineWidth: 2, marker: { enabled: false }, dataLabels: { enabled: false } } },
            series: [
                { name: '총자산(MTM)', color: '#c084fc', lineWidth: 2, data: seriesTotal },
                { name: '잔금(현금)', color: '#38bdf8', data: seriesCash },
                { name: '누적실현', color: '#4ade80', data: seriesRealized },
                { name: '평가금(보유)', color: '#f59e0b', data: seriesEval }
            ]
        });

        const cycleKeys = Object.keys(cycleDaysMap).map(Number).sort((a, b) => a - b);
        const maxCycleNo = cycleKeys.length ? Math.max(...cycleKeys) : 0;
        const currentCycleDays = cycleDaysMap[maxCycleNo] || 0;
        const lastEval = seriesEval.length ? seriesEval[seriesEval.length - 1].y : 0;
        const isCurrentActive = lastEval > 0;
        const closedCyclesCount = (isCurrentActive && maxCycleNo > 0) ? maxCycleNo - 1 : maxCycleNo;

        let winCount = 0, lossCount = 0;
        const closedDays = [];
        const profitData = [], daysData = [], cycleCategories = [];

        cycleKeys.forEach(cNo => {
            cycleCategories.push(cNo + '차');
            const pVal = cycleProfitMap[cNo] || 0;
            const dVal = cycleDaysMap[cNo] || 0;
            profitData.push({ y: pVal, color: pVal >= 0 ? '#62d3a4' : '#f87171' });
            daysData.push(dVal);

            if (!isCurrentActive || cNo < maxCycleNo) {
                closedDays.push(dVal);
                if (pVal > 0) winCount++;
                else if (pVal < 0) lossCount++;
            }
        });

        closedDays.sort((a, b) => a - b);
        const winRate = closedCyclesCount ? Math.round((winCount / (winCount + lossCount || 1)) * 100) : 0;
        const medianDays = closedDays.length ? closedDays[Math.floor(closedDays.length / 2)] : 0;
        const maxDays = closedDays.length ? Math.max(...closedDays) : 0;

        document.getElementById('card-total-cycles').innerText = `${seasonName}-${maxCycleNo}-${currentCycleDays}일`;
        document.getElementById('card-closed-cycles-sub').innerText = `총 ${closedCyclesCount}회 마감`;
        document.getElementById('card-win-rate').innerText = winRate + '%';
        document.getElementById('card-win-loss-count').innerText = `${winCount}승 · ${lossCount}패`;
        document.getElementById('card-median-days').innerText = medianDays + '일';
        document.getElementById('card-max-days').innerText = maxDays + '일';

        Highcharts.chart('cycle-chart-container', {
            chart: { backgroundColor: '#0b0f19' },
            title: { text: 'Cycle Performance', align: 'left', style: { color: '#f8fafc', fontSize: '15px', fontWeight: 'bold' } },
            xAxis: { categories: cycleCategories, tickInterval: 3, labels: { style: { color: '#94a3b8', fontSize: '10px' } } },
            yAxis: [
                { title: null, gridLineColor: '#1e293b', labels: { format: '${value:,.0f}', style: { color: '#94a3b8', fontSize: '10px' } } }, 
                { title: null, opposite: true, gridLineWidth: 0, labels: { format: '{value}일', style: { color: '#94a3b8', fontSize: '10px' } } }
            ],
            legend: { itemStyle: { color: '#cbd5e1', fontSize: '11px' } },
            credits: { enabled: false },
            series: [
                { name: '사이클 실현($)', type: 'column', yAxis: 0, data: profitData },
                { name: '소요일수', type: 'line', yAxis: 1, data: daysData, color: '#60a5fa', dashStyle: 'ShortDash', marker: { enabled: false } }
            ]
        });

        Highcharts.chart('cum-return-chart-container', {
            chart: { backgroundColor: '#0b0f19' },
            title: { text: 'Cumulative Return', align: 'left', style: { color: '#f8fafc', fontSize: '15px', fontWeight: 'bold' } },
            xAxis: { type: 'datetime', labels: { style: { color: '#94a3b8', fontSize: '10px' }, format: '{value:%m/%d}' }, tickPixelInterval: 120 },
            yAxis: { title: null, gridLineColor: '#1e293b', labels: { format: '{value}%', style: { color: '#94a3b8', fontSize: '10px' } } },
            tooltip: { 
                formatter: function () {
                    const displayDate = this.point && this.point.dateStr ? this.point.dateStr : '';
                    return `<span style="font-size: 11px; color: #cbd5e1;">${displayDate}</span><br/><span style="color:${this.color}">●</span> ${this.series.name}: <b>${this.y}%</b>`;
                }
            },
            legend: { itemStyle: { color: '#cbd5e1', fontSize: '11px' } },
            credits: { enabled: false },
            series: [
                { name: `누적 실현`, type: 'line', step: 'left', data: cumReturnData, color: '#a855f7', lineWidth: 2, marker: { enabled: false } },
                { name: '마감(수익)', type: 'scatter', data: winMarkers, color: '#62d3a4' },
                { name: '마감(손실)', type: 'scatter', data: lossMarkers, color: '#f87171' }
            ]
        });
    }
});
</script>
</body>
</html>
